<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#e10000" />

    <!-- Yazı tipleri kendi sunucumuzdan geliyor. Eskiden burada
         fonts.googleapis.com'a giden bir stylesheet vardı: boyamayı bloklayan,
         üçüncü taraf bir origin. DNS + TCP + TLS el sıkışması doğrudan ilk
         boyamanın önündeydi. @font-face kuralları artık site CSS'inin içinde
         (src/fonts-google.css, scripts/fonts.mjs üretir), yüz dosyaları
         /fonts/google altında; kritik yolda fazladan istek kalmadı. -->

    <!-- Admin panelinde kaydedilen metinlerin isteği burada, sayfanın en
         başında başlatılıyor.
         
         Eskiden istek React yüklendikten sonra çıkıyordu ve mobil bağlantıda
         ancak 2,6 saniyede dönüyordu; metin o anda değişince hem yerleşim
         kayıyor hem de sayfanın en büyük boyaması geriye atılıyordu. Buradan
         başlatılınca yanıt ilk boyamaya yetişiyor.

         Sözleşme src/content/remote.ts ile aynı: hiçbir koşulda hata
         fırlatmaz, başarısızlıkta null olur ve site koddaki metinle çalışır.
         Anon anahtar zaten tarayıcıya gömülü, burada yeni bir şey açılmıyor. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <script>
      (function () {
        var base = '%VITE_SUPABASE_URL%';
        var key = '%VITE_SUPABASE_ANON_KEY%';
        if (!base || !key || base.charAt(0) === '%') return;
        window.__stlContent = fetch(base + '/rest/v1/site_content?select=page,tr,en', {
          headers: { apikey: key, Authorization: 'Bearer ' + key, Accept: 'application/json' },
        })
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .catch(function () {
            return null;
          });
      })();
    </script>

    <!-- Kaydırma animasyonları (Reveal) yalnızca JavaScript varken gizli başlar;
         kural CSS'te `html.js` ile kapılı. Betik boyamadan önce çalışmalı, yoksa
         içerik bir kare görünüp sonra kaybolur. JavaScript çalıştırmayan
         tarayıcıda sınıf hiç eklenmez ve metin görünür kalır. -->
    <script>
      document.documentElement.classList.add('js');
    </script>

    <!-- Google tag (gtag.js) — betik yalnızca çerez onayından sonra yükleniyor,
         yükleme ve page_view gönderimi src/lib/analytics.ts tarafında. Buradaki
         kuyruk onaya kadar bekler; varsayılan izinler reddedilmiş sayılır. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500,
      });
      gtag('js', new Date());
      gtag('config', 'G-H2L0367MVL', { send_page_view: false });
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
